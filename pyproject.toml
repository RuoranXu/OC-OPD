[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oc-opd"
version = "0.3.0"
description = "OC-OPD and training baselines on a veRL distributed runtime"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
oc-opd-train = "oc_opd.trainer.main:main"

[project.urls]
Repository = "https://github.com/RuoranXu/OC-OPD"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
train = {file = ["requirements-train.txt"]}
vllm = {file = ["requirements-vllm.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["oc_opd*", "verl*"]

[tool.setuptools.package-data]
oc_opd = ["trainer/config/*.yaml"]
verl = ["**/*.yaml", "version/version", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
extend-exclude = ["verl"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
